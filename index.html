<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Control de Cuentas por Cobrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6">

  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-white p-6 rounded-lg shadow">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Control de Cuentas por Cobrar</h1>
        <p class="text-sm text-gray-500">Sistema integrado con Supabase</p>
      </div>
      <div id="status-badge" class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-sm font-semibold">
        Conectando...
      </div>
    </div>

    <!-- KPIs -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white p-5 rounded-lg shadow border-l-4 border-blue-500">
        <span class="text-sm text-gray-500 font-medium">Facturas Registradas</span>
        <p class="text-3xl font-bold text-gray-900 mt-1" id="total-facturas">0</p>
      </div>
      <div class="bg-white p-5 rounded-lg shadow border-l-4 border-emerald-500">
        <span class="text-sm text-gray-500 font-medium">Clientes Registrados</span>
        <p class="text-3xl font-bold text-gray-900 mt-1" id="total-clientes">0</p>
      </div>
    </div>

    <!-- Tabla de Facturas -->
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-bold mb-4">Listado de Facturas</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-gray-50 text-xs text-gray-500 uppercase">
              <th class="p-3">Folio</th>
              <th class="p-3">Fecha</th>
              <th class="p-3">Monto Total</th>
              <th class="p-3">Moneda</th>
              <th class="p-3">Estatus</th>
            </tr>
          </thead>
          <tbody id="tabla-facturas">
            <tr><td colspan="5" class="p-4 text-center text-gray-500">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // CREDENCIALES EXACTAS DE TU PROYECTO
    const SUPABASE_URL = 'https://dwklqjswdgoxqooblmeg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3a2xxanN3ZGdveHFvb2JsbWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTE5MTIsImV4cCI6MjEwNzk2NzkxMn0.S_TaeU4YGwj4lL3pGzYaLgSmeIAGHQlWoz3wCH2HUqY'; // Reemplaza por tu clave completa que empieza con sb_publishable_...

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function cargarDatos() {
      const badge = document.getElementById('status-badge');
      try {
        // Consultar facturas
        const { data: invoices, error: invErr } = await client.from('invoices').select('*');
        if (invErr) throw invErr;

        // Consultar clientes
        const { data: customers, error: custErr } = await client.from('customers').select('*');
        if (custErr) throw custErr;

        badge.className = 'px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-sm font-semibold';
        badge.innerText = 'Conectado con Éxito';

        document.getElementById('total-facturas').innerText = invoices.length;
        document.getElementById('total-clientes').innerText = customers.length;

        let html = '';
        if (invoices.length > 0) {
          invoices.forEach(inv => {
            html += `<tr class="border-b">
              <td class="p-3 font-semibold">${inv.invoice_number}</td>
              <td class="p-3">${inv.invoice_date}</td>
              <td class="p-3 font-bold">$${parseFloat(inv.total).toLocaleString('es-MX', {minimumFractionDigits: 2})}</td>
              <td class="p-3">${inv.currency}</td>
              <td class="p-3"><span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded">${inv.status}</span></td>
            </tr>`;
          });
        } else {
          html = '<tr><td colspan="5" class="p-4 text-center text-gray-500">No hay facturas en la base de datos.</td></tr>';
        }
        document.getElementById('tabla-facturas').innerHTML = html;

      } catch (err) {
        console.error('Error al conectar:', err);
        badge.className = 'px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm font-semibold';
        badge.innerText = 'Error: ' + (err.message || 'Sin acceso');
      }
    }

    document.addEventListener('DOMContentLoaded', cargarDatos);
  </script>
</body>
</html>
