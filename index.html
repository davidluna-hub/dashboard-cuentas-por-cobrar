  // -------------------------------------------------------
  // UTILIDADES
  // -------------------------------------------------------

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
  }

  function money(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
  }

  function fmtMoney(value) {
    return money(value).toLocaleString('es-MX', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function normalizedId(value) {
    return String(value ?? '').trim().toLowerCase();
  }

  function invoiceIdOf(invoice) {
    return normalizedId(invoice?.invoice_id || invoice?.id);
  }

  function todayISO() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
      .toISOString()
      .slice(0, 10);
  }

  function cancelled(inv) {
    const status = String(
      inv?.collection_status || inv?.status || ''
    ).trim().toLowerCase();

    return ['cancelada', 'cancelado', 'cancelled', 'canceled'].includes(status);
  }

  /*
   * Agrupa los pagos por invoice_id.
   * Si una factura tiene varios abonos, se suman.
   */
  function getPaymentsForInvoice(invoice) {
    const id = invoiceIdOf(invoice);
    if (!id) return [];

    return globalPayments
      .filter(p => normalizedId(p.invoice_id) === id)
      .sort((a, b) =>
        String(b.payment_date || '').localeCompare(
          String(a.payment_date || '')
        )
      );
  }

  function sumPayments(payments) {
    return payments.reduce((sum, p) => sum + money(p.amount), 0);
  }

  /*
   * Devuelve los importes efectivos de una factura.
   *
   * Si existen registros en payments, su suma es la fuente
   * principal del importe abonado.
   *
   * Si no hay pagos registrados, conserva el valor paid
   * calculado por la vista como alternativa.
   */
  function getInvoiceAmounts(invoice) {
    const total = money(invoice?.total);
    const payments = getPaymentsForInvoice(invoice);
    const hasPayments = payments.length > 0;

    const paidFromView = money(invoice?.paid);
    const paidFromPayments = sumPayments(payments);

    const paid = hasPayments ? paidFromPayments : paidFromView;

    // Si hay pagos registrados, calcula el saldo usando esos pagos.
    // Si no, conserva el saldo que proporciona la vista.
    const balance = hasPayments
      ? Math.max(0, total - paid)
      : Math.max(0, money(invoice?.balance));

    return {
      total,
      paid,
      balance,
      payments,
      hasPayments
    };
  }

  function getBalanceByInvoiceId(invoiceId) {
    const id = normalizedId(invoiceId);

    return globalBalances.find(b =>
      normalizedId(b.invoice_id || b.id) === id
    );
  }

  function getInvoiceRecordById(invoiceId) {
    const id = normalizedId(invoiceId);

    return globalInvoices.find(inv =>
      normalizedId(inv.id || inv.invoice_id) === id
    );
  }

  function getCustomerById(customerId) {
    const id = normalizedId(customerId);

    return globalCustomers.find(c =>
      normalizedId(c.id) === id
    );
  }

  function getCustomerName(invoice) {
    const customer = getCustomerById(invoice?.customer_id);
    return customer?.legal_name || 'Sin cliente';
  }

  function getEffectiveRows() {
    return globalBalances.map(b => {
      const amounts = getInvoiceAmounts(b);

      return {
        ...b,
        total: amounts.total,
        paid: amounts.paid,
        balance: amounts.balance
      };
    });
  }

  function overdueDays(inv) {
    if (!inv?.due_date || money(inv.balance) <= 0 || cancelled(inv)) {
      return 0;
    }

    const due = new Date(String(inv.due_date).slice(0, 10) + 'T00:00:00');
    const now = new Date(todayISO() + 'T00:00:00');

    if (Number.isNaN(due.getTime())) return 0;

    return Math.max(0, Math.floor((now - due) / 86400000));
  }

  function dueInDays(inv) {
    if (!inv?.due_date || money(inv.balance) <= 0 || cancelled(inv)) {
      return null;
    }

    const due = new Date(String(inv.due_date).slice(0, 10) + 'T00:00:00');
    const now = new Date(todayISO() + 'T00:00:00');

    if (Number.isNaN(due.getTime())) return null;

    return Math.floor((due - now) / 86400000);
  }

  function showSection(name, button) {
    document.querySelectorAll('main > section').forEach(section => {
      section.classList.add('hidden');
    });

    const section = document.getElementById('sec-' + name);
    if (section) section.classList.remove('hidden');

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.remove('bg-slate-900', 'text-white');
      btn.classList.add('text-slate-600', 'hover:bg-slate-100');
    });

    const activeButton = button ||
      document.querySelector(`.nav-btn[onclick*="showSection('${name}'"]`);

    if (activeButton) {
      activeButton.classList.add('bg-slate-900', 'text-white');
      activeButton.classList.remove('text-slate-600', 'hover:bg-slate-100');
    }

    if (name === 'analitica') {
      setTimeout(renderCharts, 50);
    }
  }

  async function initDashboard() {
    const badge = document.getElementById('status-badge');

    try {
      badge.innerText = 'Actualizando datos...';

      const [
        customersResult,
        invoicesResult,
        balancesResult,
        paymentsResult
      ] = await Promise.all([
        client
          .from('customers')
          .select('*')
          .order('legal_name'),

        client
          .from('invoices')
          .select('*, customers(legal_name)')
          .order('invoice_date', { ascending: false }),

        client
          .from('invoice_balances')
          .select('*'),

        client
          .from('payments')
          .select('id, invoice_id, payment_date, amount, currency, reference')
          .order('payment_date', { ascending: false })
      ]);

      const results = [
        ['clientes', customersResult],
        ['facturas', invoicesResult],
        ['vista de saldos', balancesResult],
        ['pagos', paymentsResult]
      ];

      const errors = results.filter(([, result]) => result.error);

      if (errors.length) {
        console.error('Errores al consultar Supabase:', errors);
        throw new Error(
          errors.map(([name, result]) =>
            `${name}: ${result.error.message}`
          ).join(' | ')
        );
      }

      globalCustomers = customersResult.data || [];
      globalInvoices = invoicesResult.data || [];
      globalBalances = balancesResult.data || [];
      globalPayments = paymentsResult.data || [];

      console.info('Datos cargados:', {
        clientes: globalCustomers.length,
        facturas: globalInvoices.length,
        saldos: globalBalances.length,
        pagos: globalPayments.length
      });

      badge.className =
        'px-3 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full text-xs font-semibold flex items-center gap-2';

      badge.innerHTML =
        '<span class="w-2 h-2 rounded-full bg-emerald-400"></span>' +
        `Conectado · ${globalPayments.length} pagos`;

      renderKPIs();
      renderFacturas();
      populateSelects();

      const today = todayISO();

      const fechaEmision = document.getElementById('input-fecha-emision');
      const fechaVencimiento = document.getElementById('input-fecha-vencimiento');
      const fechaPago = document.getElementById('input-fecha-pago');

      if (fechaEmision && !fechaEmision.value) fechaEmision.value = today;
      if (fechaVencimiento && !fechaVencimiento.value) fechaVencimiento.value = today;
      if (fechaPago && !fechaPago.value) fechaPago.value = today;

      // Si el usuario ya tenía un cliente seleccionado, refresca su estado.
      const selectorEstado = document.getElementById('select-cliente-estado');
      if (selectorEstado?.value) verEstadoCuenta();

    } catch (err) {
      console.error('Error al inicializar la dashboard:', err);

      badge.className =
        'px-3 py-1 bg-red-500/20 text-red-300 border border-red-500/30 rounded-full text-xs font-semibold';

      badge.innerText = 'Error de conexión';

      alert(
        'No se pudieron cargar todos los datos de Supabase. ' +
        'Revisa la consola del navegador para ver el error.'
      );
    }
  }

  // -------------------------------------------------------
  // INDICADORES Y GRÁFICAS
  // -------------------------------------------------------

  function drawChart(id, config) {
    const el = document.getElementById(id);
    if (!el || !window.Chart) return;

    if (chartInstances[id]) chartInstances[id].destroy();
    chartInstances[id] = new Chart(el, config);
  }

  function renderCharts() {
    if (!window.Chart) return;

    const rows = getEffectiveRows().filter(b => !cancelled(b));
    const overdue = rows.filter(b => overdueDays(b) > 0);

    drawChart('chart-status', {
      type: 'doughnut',
      data: {
        labels: ['Pagadas', 'Vencidas', 'Pendientes vigentes'],
        datasets: [{
          data: [
            rows.filter(b => money(b.balance) <= 0).length,
            overdue.length,
            rows.filter(b =>
              money(b.balance) > 0 && overdueDays(b) === 0
            ).length
          ],
          backgroundColor: ['#879a83', '#c96c65', '#c9ad7c'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } }
      }
    });

    const lines = ['Carton', 'Foam', 'Otro'];

    drawChart('chart-business', {
      type: 'bar',
      data: {
        labels: lines.map(x => x === 'Carton' ? 'Cartón' : x),
        datasets: [
          {
            label: 'MXN',
            data: lines.map(line =>
              rows
                .filter(b =>
                  (b.business_line || 'Carton') === line &&
                  b.currency === 'MXN'
                )
                .reduce((sum, b) => sum + money(b.balance), 0)
            ),
            backgroundColor: '#879a83'
          },
          {
            label: 'USD',
            data: lines.map(line =>
              rows
                .filter(b =>
                  (b.business_line || 'Carton') === line &&
                  b.currency === 'USD'
                )
                .reduce((sum, b) => sum + money(b.balance), 0)
            ),
            backgroundColor: '#9ba9b8'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true } },
        plugins: { legend: { position: 'bottom' } }
      }
    });

    const months = [];
    const now = new Date();

    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);

      months.push({
        key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`,
        label: d.toLocaleDateString('es-MX', {
          month: 'short',
          year: '2-digit'
        })
      });
    }

    drawChart('chart-monthly', {
      type: 'bar',
      data: {
        labels: months.map(m => m.label),
        datasets: [
          {
            label: 'MXN facturado',
            data: months.map(m =>
              globalInvoices
                .filter(i =>
                  String(i.invoice_date || '').slice(0, 7) === m.key &&
                  i.currency === 'MXN' &&
                  !cancelled(i)
                )
                .reduce((sum, i) => sum + money(i.total), 0)
            ),
            backgroundColor: '#879a83'
          },
          {
            label: 'USD facturado',
            data: months.map(m =>
              globalInvoices
                .filter(i =>
                  String(i.invoice_date || '').slice(0, 7) === m.key &&
                  i.currency === 'USD' &&
                  !cancelled(i)
                )
                .reduce((sum, i) => sum + money(i.total), 0)
            ),
            backgroundColor: '#9ba9b8'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true } },
        plugins: { legend: { position: 'bottom' } }
      }
    });

    const ranges = [
      { label: '1–30 días', min: 1, max: 30 },
      { label: '31–60 días', min: 31, max: 60 },
      { label: '61–90 días', min: 61, max: 90 },
      { label: 'Más de 90', min: 91, max: Infinity }
    ];

    drawChart('chart-aging', {
      type: 'bar',
      data: {
        labels: ranges.map(r => r.label),
        datasets: [
          {
            label: 'MXN',
            data: ranges.map(r =>
              overdue
                .filter(b =>
                  b.currency === 'MXN' &&
                  overdueDays(b) >= r.min &&
                  overdueDays(b) <= r.max
                )
                .reduce((sum, b) => sum + money(b.balance), 0)
            ),
            backgroundColor: '#c96c65'
          },
          {
            label: 'USD',
            data: ranges.map(r =>
              overdue
                .filter(b =>
                  b.currency === 'USD' &&
                  overdueDays(b) >= r.min &&
                  overdueDays(b) <= r.max
                )
                .reduce((sum, b) => sum + money(b.balance), 0)
            ),
            backgroundColor: '#9ba9b8'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true } },
        plugins: { legend: { position: 'bottom' } }
      }
    });
  }

  function renderKPIs() {
    const active = getEffectiveRows().filter(b => !cancelled(b));

    const totalMXN = active
      .filter(b => b.currency === 'MXN')
      .reduce((sum, b) => sum + money(b.total), 0);

    const totalUSD = active
      .filter(b => b.currency === 'USD')
      .reduce((sum, b) => sum + money(b.total), 0);

    const saldoMXN = active
      .filter(b => b.currency === 'MXN')
      .reduce((sum, b) => sum + money(b.balance), 0);

    const saldoUSD = active
      .filter(b => b.currency === 'USD')
      .reduce((sum, b) => sum + money(b.balance), 0);

    /*
     * Calcula el total pagado por moneda directamente desde payments.
     * Así no depende de que invoice_balances.paid esté actualizado.
     */
    const validInvoiceIds = new Set(
      active.map(b => invoiceIdOf(b)).filter(Boolean)
    );

    const paymentsForActiveInvoices = globalPayments.filter(p =>
      validInvoiceIds.has(normalizedId(p.invoice_id))
    );

    const paidMXN = paymentsForActiveInvoices
      .filter(p => String(p.currency || '').toUpperCase() === 'MXN')
      .reduce((sum, p) => sum + money(p.amount), 0);

    const paidUSD = paymentsForActiveInvoices
      .filter(p => String(p.currency || '').toUpperCase() === 'USD')
      .reduce((sum, p) => sum + money(p.amount), 0);

    const late = active.filter(b => overdueDays(b) > 0);

    const lateMXN = late
      .filter(b => b.currency === 'MXN')
      .reduce((sum, b) => sum + money(b.balance), 0);

    const lateUSD = late
      .filter(b => b.currency === 'USD')
      .reduce((sum, b) => sum + money(b.balance), 0);

    const soon = active.filter(b => {
      const days = dueInDays(b);
      return money(b.balance) > 0 &&
        days !== null &&
        days >= 0 &&
        days <= 7;
    });

    document.getElementById('kpi-total-facturado').innerText =
      '$' + fmtMoney(totalMXN) + ' MXN';

    document.getElementById('kpi-count-facturas').innerText =
      `${active.length} facturas activas · $${fmtMoney(totalUSD)} USD facturados`;

    document.getElementById('kpi-total-pagado-mxn').innerText =
      '$' + fmtMoney(paidMXN) + ' MXN';

    document.getElementById('kpi-total-pagado-usd').innerText =
      '$' + fmtMoney(paidUSD) + ' USD abonados';

    document.getElementById('kpi-saldo-mxn').innerText =
      '$' + fmtMoney(saldoMXN) + ' MXN';

    document.getElementById('kpi-saldo-usd').innerText =
      '$' + fmtMoney(saldoUSD) + ' USD';

    document.getElementById('kpi-total-clientes').innerText =
      globalCustomers.filter(c => c.active !== false).length;

    document.getElementById('kpi-vencidas').innerText = late.length;

    document.getElementById('kpi-vencidas-monto').innerText =
      `Saldo vencido: MXN $${fmtMoney(lateMXN)} · USD $${fmtMoney(lateUSD)}`;

    document.getElementById('kpi-por-vencer').innerText = soon.length;

    document.getElementById('kpi-pagos').innerText =
      globalPayments.length;

    document.getElementById('kpi-pagos-monto').innerText =
      `MXN $${fmtMoney(paidMXN)} · USD $${fmtMoney(paidUSD)}`;

    document.getElementById('kpi-recuperacion').innerText =
      totalMXN > 0
        ? `${Math.round(paidMXN / totalMXN * 100)}% MXN`
        : '—';

    renderCharts();
  }

  // -------------------------------------------------------
  // TABLA PRINCIPAL DE FACTURAS

  function renderFacturas() {
    const businessFilter = document.getElementById('filter-business')?.value || 'ALL';
    const currencyFilter = document.getElementById('filter-currency')?.value || 'ALL';

    const search = (
      document.getElementById('filter-search')?.value || ''
    ).trim().toLocaleLowerCase('es-MX');

    let filtered = getEffectiveRows();

    if (businessFilter !== 'ALL') {
      filtered = filtered.filter(b =>
        (b.business_line || 'Carton') === businessFilter
      );
    }

    if (currencyFilter !== 'ALL') {
      filtered = filtered.filter(b => b.currency === currencyFilter);
    }

    if (search) {
      filtered = filtered.filter(b => {
        const customer = getCustomerById(b.customer_id);

        return String(b.invoice_number || '')
          .toLocaleLowerCase('es-MX')
          .includes(search) ||
          String(customer?.legal_name || '')
            .toLocaleLowerCase('es-MX')
            .includes(search);
      });
    }

    let html = '';

    if (filtered.length) {
      filtered.forEach(inv => {
        const clienteNombre = getCustomerName(inv);
        const negocio = inv.business_line || 'Carton';

        const amounts = getInvoiceAmounts(inv);
        const pagosFactura = amounts.payments;
        const totalPagado = amounts.paid;
        const saldo = amounts.balance;

        const estadoFactura = String(
          inv.collection_status || inv.status || ''
        ).trim().toLowerCase();

        let statusBadge =
          '<span class="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded font-semibold">PENDIENTE</span>';

        if (cancelled(inv)) {
          statusBadge =
            '<span class="bg-slate-100 text-slate-700 text-xs px-2 py-1 rounded font-semibold">CANCELADA</span>';
        } else if (saldo <= 0) {
          statusBadge =
            '<span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded font-semibold">PAGADA</span>';
        } else if (overdueDays({ ...inv, balance: saldo }) > 0 ||
                   estadoFactura === 'vencida') {
          statusBadge =
            '<span class="bg-red-100 text-red-800 text-xs px-2 py-1 rounded font-semibold">VENCIDA</span>';
        }

        const fmt = fmtMoney;

        const detallePagos = pagosFactura.length
          ? pagosFactura.slice(0, 3).map(p =>
              `${escapeHtml(p.payment_date || 'Sin fecha')}: $${fmt(p.amount)} ${escapeHtml(p.currency || inv.currency || '')}` +
              (p.reference ? ` <span class="text-slate-400">(${escapeHtml(p.reference)})</span>` : '')
            ).join('<br>') +
            (pagosFactura.length > 3
              ? `<br><span class="text-slate-400">+${pagosFactura.length - 3} abono(s)</span>`
              : '')
          : '<span class="text-slate-400">Sin abonos registrados</span>';

        const overdue = overdueDays({ ...inv, balance: saldo });
        const dueIn = dueInDays({ ...inv, balance: saldo });

        html += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3.5 font-bold text-slate-900">
              ${escapeHtml(inv.invoice_number || '')}
            </td>
            <td class="p-3.5 font-medium">${escapeHtml(clienteNombre)}</td>
            <td class="p-3.5"><span class="pill-neutral">${escapeHtml(negocio)}</span></td>
            <td class="p-3.5 text-xs whitespace-nowrap">
              <div>Emisión: ${escapeHtml(inv.invoice_date || '—')}</div>
              <div class="mt-1 ${overdue > 0 ? 'text-rose-700 font-bold' : 'text-slate-500'}">
                Vence: ${escapeHtml(inv.due_date || 'Sin fecha')}
              </div>
            </td>
            <td class="p-3.5 font-semibold whitespace-nowrap">
              $${fmt(inv.total)} ${escapeHtml(inv.currency || '')}
            </td>
            <td class="p-3.5 payment-detail text-xs">
              <div class="font-semibold text-slate-700">
                ${totalPagado > 0
                  ? `Abonado: $${fmt(totalPagado)} ${escapeHtml(inv.currency || '')}`
                  : 'Sin pagos'}
              </div>
              <div class="mt-1 text-slate-500">${detallePagos}</div>
            </td>
            <td class="p-3.5 font-bold whitespace-nowrap ${saldo > 0 ? 'text-amber-700' : 'text-emerald-700'}">
              $${fmt(saldo)} ${escapeHtml(inv.currency || '')}
            </td>
            <td class="p-3.5">
              ${overdue > 0
                ? `<span class="aging-badge aging-late">${overdue} días vencidos</span>`
                : saldo <= 0
                  ? '<span class="aging-badge aging-ok">Liquidada</span>'
                  : dueIn !== null && dueIn <= 7
                    ? `<span class="aging-badge aging-soon">${dueIn === 0 ? 'Vence hoy' : `Vence en ${dueIn} días`}</span>`
                    : '<span class="text-xs text-slate-400">Al corriente</span>'}
            </td>
            <td class="p-3.5">${statusBadge}</td>
          </tr>`;
      });
    } else {
      html =
        '<tr><td colspan="9" class="p-6 text-center text-slate-400">No hay facturas con estos filtros.</td></tr>';
    }

    document.getElementById('tabla-facturas').innerHTML = html;
  }

  function populateSelects() {
    let customerOptions = '<option value="">-- Selecciona Cliente --</option>';

    globalCustomers.forEach(c => {
      customerOptions += `
        <option value="${escapeHtml(c.id)}">
          ${escapeHtml(c.legal_name || 'Cliente sin nombre')}
        </option>`;
    });

    document.getElementById('select-cliente-factura').innerHTML =
      customerOptions;

    document.getElementById('select-cliente-estado').innerHTML =
      customerOptions;

    let invoiceOptions =
      '<option value="">-- Selecciona Factura con Saldo --</option>';

    getEffectiveRows()
      .filter(b => money(b.balance) > 0 && !cancelled(b))
      .forEach(b => {
        const customerName = getCustomerName(b);
        const id = invoiceIdOf(b);

        invoiceOptions += `
          <option value="${escapeHtml(id)}">
            ${escapeHtml(b.invoice_number || 'Sin folio')} -
            ${escapeHtml(customerName)}
            (Saldo: $${fmtMoney(b.balance)} ${escapeHtml(b.currency || '')})
          </option>`;
      });

    document.getElementById('select-factura-pago').innerHTML =
      invoiceOptions;
  }

  // -------------------------------------------------------
  // REGISTRAR FACTURA
  // -------------------------------------------------------

  async function guardarFactura(e) {
    e.preventDefault();

    const customer_id =
      document.getElementById('select-cliente-factura').value;

    const invoice_number =
      document.getElementById('input-folio').value.trim();

    const business_line =
      document.getElementById('select-negocio').value;

    const invoice_date =
      document.getElementById('input-fecha-emision').value;

    const due_date =
      document.getElementById('input-fecha-vencimiento').value;

    const currency =
      document.getElementById('select-moneda').value;

    const total = parseFloat(
      document.getElementById('input-monto').value
    );

    if (!customer_id) {
      alert('Selecciona un cliente.');
      return;
    }

    if (!invoice_number) {
      alert('Captura el folio de la factura.');
      return;
    }

    if (!Number.isFinite(total) || total <= 0) {
      alert('Captura un monto total mayor a cero.');
      return;
    }

    const subtotal = total;
    const tax = 0;

    const { error } = await client
      .from('invoices')
      .insert([{
        customer_id,
        invoice_number,
        source: 'manual',
        business_line,
        invoice_date,
        due_date,
        currency,
        subtotal,
        tax,
        total,
        status: 'abierta'
      }]);

    if (error) {
      console.error('Error al guardar factura:', error);
      alert('Error al guardar factura: ' + error.message);
      return;
    }

    alert('¡Factura guardada con éxito!');
    e.target.reset();

    await initDashboard();
    showSection('facturas');
  }

  // -------------------------------------------------------
  // REGISTRAR PAGO / ABONO
  // -------------------------------------------------------

  async function guardarPago(e) {
    e.preventDefault();

    const invoice_id =
      document.getElementById('select-factura-pago').value;

    const payment_date =
      document.getElementById('input-fecha-pago').value;

    const amount = parseFloat(
      document.getElementById('input-monto-pago').value
    );

    const reference =
      document.getElementById('input-ref-pago').value.trim();

    if (!invoice_id) {
      alert('Selecciona una factura pendiente.');
      return;
    }

    if (!payment_date) {
      alert('Selecciona la fecha del pago.');
      return;
    }

    if (!Number.isFinite(amount) || amount <= 0) {
      alert('Captura un monto de abono mayor a cero.');
      return;
    }

    /*
     * Primero busca la factura en la vista de saldos y luego
     * en invoices. Los identificadores se comparan normalizados.
     */
    const balanceRecord = getBalanceByInvoiceId(invoice_id);
    const invoiceRecord = getInvoiceRecordById(invoice_id);

    const currency =
      balanceRecord?.currency ||
      invoiceRecord?.currency;

    if (!balanceRecord && !invoiceRecord) {
      console.error('No se encontró la factura:', {
        invoice_id,
        balanceRecord,
        invoiceRecord
      });

      alert(
        'No se encontró la factura seleccionada. ' +
        'Verifica que invoice_balances.invoice_id corresponda al ID de invoices.'
      );
      return;
    }

    if (!currency) {
      alert(
        'No se pudo determinar la moneda de la factura. ' +
        'Verifica el campo currency en Supabase.'
      );
      return;
    }

    const currentAmounts = getInvoiceAmounts(
      balanceRecord || invoiceRecord
    );

    if (amount > currentAmounts.balance + 0.01) {
      const proceed = confirm(
        `El abono ($${fmtMoney(amount)}) supera el saldo calculado ` +
        `($${fmtMoney(currentAmounts.balance)} ${currency}).\n\n` +
        '¿Deseas registrarlo de todos modos?'
      );

      if (!proceed) return;
    }

    const { error } = await client
      .from('payments')
      .insert([{
        invoice_id,
        payment_date,
        amount,
        currency,
        reference: reference || null
      }]);

    if (error) {
      console.error('Error al aplicar pago:', error);
      alert('Error al aplicar pago: ' + error.message);
      return;
    }

    alert('¡Pago registrado correctamente! La dashboard se actualizará.');

    e.target.reset();
    document.getElementById('input-fecha-pago').value = todayISO();

    await initDashboard();
    showSection('facturas');
  }

  // -------------------------------------------------------
  // ESTADO DE CUENTA POR CLIENTE
  // -------------------------------------------------------

  function verEstadoCuenta() {
    const customerId =
      document.getElementById('select-cliente-estado').value;

    const container =
      document.getElementById('detalle-estado-cuenta');

    if (!customerId) {
      container.classList.add('hidden');
      return;
    }

    container.classList.remove('hidden');

    const clientBalances = getEffectiveRows().filter(b =>
      normalizedId(b.customer_id) === normalizedId(customerId)
    );

    let saldoMXN = 0;
    let saldoUSD = 0;
    let html = '';

    clientBalances.forEach(inv => {
      const amounts = getInvoiceAmounts(inv);
      const saldo = amounts.balance;
      const totalPagado = amounts.paid;
      const pagosFactura = amounts.payments;

      if (!cancelled(inv)) {
        if (inv.currency === 'MXN') saldoMXN += saldo;
        if (inv.currency === 'USD') saldoUSD += saldo;
      }

      const pagosRecientes = pagosFactura.length
        ? pagosFactura.slice(0, 3).map(p =>
            `${escapeHtml(p.payment_date || 'Sin fecha')}: ` +
            `$${fmtMoney(p.amount)} ${escapeHtml(p.currency || inv.currency || '')}` +
            (p.reference
              ? `<br><span class="text-slate-400">${escapeHtml(p.reference)}</span>`
              : '')
          ).join('<br>')
        : '<span class="text-slate-400">Sin abonos</span>';

      const estadoFactura = String(
        inv.collection_status || inv.status || ''
      ).trim().toLowerCase();

      let estadoLabel = 'Pendiente';

      if (cancelled(inv)) {
        estadoLabel = 'Cancelada';
      } else if (saldo <= 0) {
        estadoLabel = 'Pagada';
      } else if (
        overdueDays({ ...inv, balance: saldo }) > 0 ||
        estadoFactura === 'vencida'
      ) {
        estadoLabel = 'Vencida';
      }

      const estadoClass =
        estadoLabel === 'Pagada'
          ? 'bg-emerald-50 text-emerald-700'
          : estadoLabel === 'Cancelada'
            ? 'bg-slate-100 text-slate-700'
            : estadoLabel === 'Vencida'
              ? 'bg-rose-50 text-rose-700'
              : 'bg-amber-50 text-amber-700';

      const overdue = overdueDays({ ...inv, balance: saldo });
      const dueIn = dueInDays({ ...inv, balance: saldo });

      html += `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-3 font-bold">${escapeHtml(inv.invoice_number || '')}</td>
          <td class="p-3 text-xs">
            <span class="pill-neutral">${escapeHtml(inv.business_line || 'Carton')}</span>
          </td>
          <td class="p-3 text-xs whitespace-nowrap">
            <div>Emisión: ${escapeHtml(inv.invoice_date || '—')}</div>
            <div class="mt-1 ${overdue > 0 ? 'text-rose-700 font-bold' : 'text-slate-500'}">
              Vence: ${escapeHtml(inv.due_date || 'Sin fecha')}
            </div>
          </td>
          <td class="p-3 whitespace-nowrap font-medium">
            $${fmtMoney(inv.total)} ${escapeHtml(inv.currency || '')}
          </td>
          <td class="p-3 whitespace-nowrap font-semibold text-slate-700">
            $${fmtMoney(totalPagado)} ${escapeHtml(inv.currency || '')}
          </td>
          <td class="p-3 text-xs payment-detail">${pagosRecientes}</td>
          <td class="p-3 whitespace-nowrap font-bold ${saldo > 0 ? 'text-amber-700' : 'text-emerald-700'}">
            $${fmtMoney(saldo)} ${escapeHtml(inv.currency || '')}
          </td>
          <td class="p-3">
            ${overdue > 0
              ? `<span class="aging-badge aging-late">${overdue} días vencidos</span>`
              : saldo <= 0
                ? '<span class="aging-badge aging-ok">Liquidada</span>'
                : dueIn !== null && dueIn <= 7
                  ? `<span class="aging-badge aging-soon">${dueIn === 0 ? 'Vence hoy' : `Vence en ${dueIn} días`}</span>`
                  : '<span class="text-xs text-slate-400">Al corriente</span>'}
          </td>
          <td class="p-3 text-xs">
            <span class="inline-flex rounded-full px-2.5 py-1 font-bold ${estadoClass}">
              ${escapeHtml(estadoLabel)}
            </span>
          </td>
        </tr>`;
    });

    document.getElementById('estado-saldo-mxn').innerText =
      '$' + fmtMoney(saldoMXN) + ' MXN';

    document.getElementById('estado-saldo-usd').innerText =
      '$' + fmtMoney(saldoUSD) + ' USD';

    document.getElementById('tabla-estado-cliente').innerHTML =
      html ||
      '<tr><td colspan="9" class="p-6 text-center text-slate-400">Este cliente no tiene facturas registradas.</td></tr>';
  }

  // -------------------------------------------------------
  // ARRANQUE
  // -------------------------------------------------------

  document.addEventListener('DOMContentLoaded', initDashboard);
</script>
